name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish app
        run: >
          dotnet publish src/BatPlayer/BatPlayer.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/bat_player.iss'

      - name: Generate checksums
        shell: pwsh
        run: |
          $file = Get-ChildItem installer/dist/*.exe
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
          "$hash  $($file.Name)" | Out-File -Encoding ascii SHA256SUMS.txt

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v2
        id: attest
        with:
          subject-path: installer/dist/*.exe

      - name: Prepare attestation file
        shell: pwsh
        run: Copy-Item '${{ steps.attest.outputs.bundle }}' attestation.json

      - name: Attach files to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/dist/BatPlayer-Setup-*.exe
            attestation.json
            SHA256SUMS.txt
