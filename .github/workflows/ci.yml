name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build BatPlayer.sln -c Release

      - name: Test
        run: dotnet test tests/BatPlayer.Tests/BatPlayer.Tests.csproj -c Release --no-build
